<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- Cache Control Meta Tags -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="delivery_webapp">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>delivery_webapp</title>
  <link rel="manifest" href="manifest.json">

  <script>
    // 1. Service Worker Update Detection
    let refreshing = false;
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshing) return;
        refreshing = true;
        window.location.reload();
      });

      // Periodically check for updates if the browser supports it
      window.addEventListener('load', () => {
        navigator.serviceWorker.getRegistration().then((reg) => {
          if (reg) {
            reg.update();
            // Optional: force skipWaiting if a new one is found and waiting
            if (reg.waiting) {
              reg.waiting.postMessage('skipWaiting');
            }
          }
        });
      });
    }

    // 2. Dynamic Cache-Buster for Flutter Bootstrap
    // This ensures we always fetch the latest bootstrap script from the server
    window.addEventListener('DOMContentLoaded', () => {
      const script = document.createElement('script');
      script.src = "flutter_bootstrap.js?v=" + new Date().getTime();
      script.async = true;
      document.body.appendChild(script);
    });
  </script>
</head>
<body>
</body>
</html>
